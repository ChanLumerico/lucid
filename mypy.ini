# mypy.ini — Lucid type-checking configuration
#
# Baseline (2026-05-11): 0 errors — mypy --strict passes across all production code.
# CI gate: run `python tools/check_types.py` — fails if error count increases.
#
# --strict enables: disallow-untyped-defs, disallow-any-generics, warn-return-any,
#   warn-unused-ignores, no-explicit-reexport, disallow-untyped-calls, etc.
# Remaining carve-outs:
#   - `operator` / `index` disabled: Tensor arithmetic/indexing propagation
#     requires Generic[Shape, Dtype] which is aspirational. These two codes
#     account for ~2900 errors caused by one structural limitation.

[mypy]
# Lucid is Python 3.14 only (PEP 649 lazy annotations — see pyproject).
python_version = 3.14
strict = True
ignore_missing_imports = True
disable_error_code = operator, index
# explicit-override (PEP 698): every method overriding a base must use @override.
# Catches signature drift in the deep class hierarchies (nn.Module / Function /
# Optimizer / Distribution / model zoo). Enforced 2026-06-07.
enable_error_code = explicit-override

# C++ extension module — no stubs, skip entirely.
[mypy-lucid._C.*]
ignore_missing_imports = True
ignore_errors = True

# Third-party stubs.
[mypy-numpy.*]
ignore_missing_imports = True

[mypy-mlx.*]
ignore_missing_imports = True

# Test code is type-checked but not part of the CI gate.
# Errors here are tracked separately so they don't block production fixes.
[mypy-lucid.test.*]
ignore_errors = True

# transitional (LCD-260) — removed by LCD-260-C4 once C3a–d land.
# Module.__call__ now types each call from the subclass's own forward, which
# turns the casts and ignore[override]s written around the old union return
# into redundant ones.  The per-domain sweeps (C3a–d) delete them; until then
# these packages stay green under the gate's --warn-unused-ignores /
# --enable-error-code=redundant-cast (this section beats the CLI flags).
[mypy-lucid.models.*,lucid.nn.modules.*,lucid.nn.qat.*,lucid.nn.quantized.*,lucid.nn.intrinsic.*,lucid.nn.utils.fusion,lucid.nn.utils.parametrize,lucid.nn.functional.sampling,lucid.quantization.observer,lucid.quantization._fake_quantize,lucid.benchmarks.bench_train]
warn_unused_ignores = False
disable_error_code = operator, index, redundant-cast
