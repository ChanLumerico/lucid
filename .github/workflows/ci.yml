name: Lucid C++ Engine CI

on:
  # PR gate: every push to a branch with an open PR runs the full matrix.
  pull_request:
  # Post-merge gate.  This repo's workflow is direct-push-to-main (no PRs),
  # so without a main-push trigger the engine gate effectively never ran
  # between release tags — letting stub / format / lint drift pile up
  # unseen until a tag detonated it.  Run the gate on every *code* push to
  # main (docs / web / obsidian / markdown are excluded — those are covered
  # by docs.yml and shouldn't spend macOS minutes here).  Release tags
  # always run.  ccache + concurrency-cancel keep the cost bounded.
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "web/**"
      - "obsidian/**"
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:
  schedule:
    - cron: "17 9 * * *"

# Cancel any in-flight run on the same ref when a new push lands, so
# rapid successive pushes don't pile up 7–9 min jobs.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # scripts/ci_full.sh in parts, one job each, side by side.  As a single
  # job it was 21 minutes on a push and 137 with the slow stages, every
  # stage waiting on the one before it for no reason but order; the longest
  # part is now under 20.  Pushes run the fast parts; the schedule, manual
  # runs, pull requests and tags add the slow ones.
  phase-gate:
    name: Phase gate / ${{ matrix.part }}
    runs-on: macos-26
    # Without a cap a hung run burns GitHub's 6-hour default before anyone
    # finds out — one sat at 94 minutes here before it was noticed, and
    # only because someone was watching.  Every part is well under this.
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        part: ${{ fromJSON(github.event_name == 'push' && '["core", "coreml", "checks"]' || '["core", "coreml", "checks", "native", "zoo:1/2", "zoo:2/2"]') }}

    steps:
      - uses: actions/checkout@v4

      # Lucid is Python 3.14 only: TYPE_CHECKING annotations rely on PEP 649
      # lazy evaluation (H1 + H7 forbid the alternatives).
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Enforce Apple Silicon runner
        run: |
          python - <<'PY'
          import platform

          system = platform.system()
          machine = platform.machine()
          if system != "Darwin" or machine != "arm64":
              raise SystemExit(f"Lucid CI supports macOS arm64 only, got {system}/{machine}")
          print(f"runner={system}/{machine}")
          PY

      # ccache caches C++ object files across runs.  setup.py auto-enables it
      # via shutil.which("ccache") (-DCMAKE_CXX_COMPILER_LAUNCHER), so the
      # editable build below picks it up with no further config.  Every part
      # but native builds the same release engine, so one of them saves it;
      # native adds a test tree and a sanitizer build, kept under its own key
      # and started from the release objects.
      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.part == 'native' && 'phase-gate-native' || 'phase-gate-py3.14' }}
          restore-keys: phase-gate-py3.14
          save: ${{ matrix.part == 'core' || matrix.part == 'native' }}
          max-size: 600M

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # Install build deps + mlx in the host env, then `--no-build-isolation`
          # so the editable build links against the *runtime* libmlx.dylib
          # (PEP 517 build-env paths get baked into the .so RPATH otherwise).
          # `clang-format==22.*` pinned to match local dev (Homebrew LLVM 22)
          # — the system clang-format on the macos-26 image differs in style output.
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1" mlx \
              "clang-format>=22,<23"
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run the gate's ${{ matrix.part }} part
        run: ./scripts/ci_full.sh "${{ matrix.part }}"

      # A test that dies by signal inside Core ML leaves no Python traceback,
      # and pytest's capture discards whatever the framework printed along
      # with the process. macOS still writes a crash report; the crashed
      # thread's frames are the only account of where the trap came from.
      - name: Crash report (on failure)
        if: failure()
        run: |
          for _ in 1 2 3 4 5 6; do
            f=$(ls -t ~/Library/Logs/DiagnosticReports/*.ips /Library/Logs/DiagnosticReports/*.ips 2>/dev/null | head -1)
            [ -n "$f" ] && break
            sleep 5
          done
          if [ -z "$f" ]; then echo "no crash report was written"; exit 0; fi
          echo "== $f"
          python - "$f" <<'PY' || head -120 "$f"
          import json, sys
          header, _, body = open(sys.argv[1]).read().partition("\n")
          report = json.loads(body)
          print("process:", json.loads(header).get("app_name"), "|", report.get("exception"))
          images = report.get("usedImages", [])
          threads = report.get("threads")
          if not threads:
              # A JetsamEvent or similar: a report, but not of a crash.
              print("not a crash report — no threads to unwind")
              sys.exit(0)
          thread = threads[report.get("faultingThread", 0)]
          for frame in thread.get("frames", [])[:30]:
              index = frame.get("imageIndex")
              image = images[index].get("name", "?") if index is not None and index < len(images) else "?"
              print(f"  {image:36s} {frame.get('symbol', hex(frame.get('imageOffset', 0)))}")
          PY

      # The checks part's publish gate (`scripts/ci_publish.sh`) already
      # builds + verifies the wheel into `dist/`, so we just upload it here.
      - uses: actions/upload-artifact@v4
        if: matrix.part == 'checks'
        with:
          name: lucid-wheel-py3.14
          path: dist/*.whl

  coverage:
    name: Coverage
    runs-on: macos-26
    timeout-minutes: 45          # measured 11-15 min
    # Coverage metrics aren't needed on every main code-push — the phase
    # gate already catches drift there.  Run on PRs, release tags, the
    # nightly schedule, and manual dispatch only (keeps macOS cost down).
    if: github.event_name != 'push' || startsWith(github.ref, 'refs/tags/')

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Enforce Apple Silicon runner
        run: |
          python - <<'PY'
          import platform

          system = platform.system()
          machine = platform.machine()
          if system != "Darwin" or machine != "arm64":
              raise SystemExit(f"Lucid CI supports macOS arm64 only, got {system}/{machine}")
          PY

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: coverage-py3.14
          max-size: 600M

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install build deps + mlx in the host env, then `--no-build-isolation`
          # so the editable build links against the *runtime* libmlx.dylib
          # (PEP 517 build-env paths get baked into the .so RPATH otherwise).
          # `clang-format==22.*` pinned to match local dev (Homebrew LLVM 22)
          # — the system clang-format on the macos-26 image differs in style output.
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1" mlx \
              "clang-format>=22,<23"
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Run coverage
        # Model-zoo tests are excluded — they use 50–60 GB locally, far
        # past any hosted runner. Coverage on engine / nn / optim /
        # autograd / linalg / fft / etc. fits fine.
        #
        # Three processes, split the way scripts/ci_full.sh splits the fast
        # tier: one process carrying every earlier test into the Core ML
        # export smoke file runs the runner out of memory. --parallel-mode
        # writes a data file per process and ``combine`` joins them.
        run: |
          python -m pip install coverage
          mkdir -p build/coverage
          IGNORES="--ignore=lucid/test/parity --ignore=lucid/test/integration --ignore=lucid/test/perf --ignore=lucid/test/unit/models"
          COREML=lucid/test/unit/coreml
          SMOKE=$COREML/test_family_export_smoke.py
          python -m coverage run --parallel-mode --source=lucid -m pytest lucid/test/ $IGNORES --ignore=$COREML -q
          python -m coverage run --parallel-mode --source=lucid -m pytest $COREML --ignore=$SMOKE -q
          python -m coverage run --parallel-mode --source=lucid -m pytest $SMOKE -q
          python -m coverage combine
          python -m coverage xml -o build/coverage/coverage.xml
          python -m coverage report

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-coverage-xml
          path: build/coverage/coverage.xml

  # ── Nightly: every test the push gate leaves out ─────────────────────
  # The gate ignores lucid/test/unit/models (all but four files), runs the
  # parity tier without the reference framework — so it skips wholesale —
  # and deselects the heavy and control markers.  These jobs run all of it,
  # one process per file, with the oracles installed and LUCID_TEST_NETWORK
  # on; scripts/ci_nightly_suite.py fails on a skip as well as a failure,
  # so a test that silently stops running is caught the next night.
  #
  # The long-training parity — 3,000 steps against the reference, on both
  # devices — is 41 of this tier's 59 minutes on a hosted runner and half
  # that on an M4 Max, so it is a job of its own: on the Mac Studio's
  # self-hosted runner while the repository variable STUDIO_RUNNER is "on",
  # on a hosted runner otherwise.  Turn the variable off when the Studio is
  # away, or the job waits for it.  Only the schedule and manual runs reach
  # this job, never a pull request, and the repository requires approval
  # before any outside contributor's workflow runs at all: a self-hosted
  # runner is a real machine.
  nightly-parity:
    name: Nightly parity (${{ matrix.part }})
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.part == 'long training' && vars.STUDIO_RUNNER == 'on' && fromJSON('["self-hosted", "studio"]') || 'macos-26' }}
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - part: every oracle
            files: lucid/test/parity --exclude lucid/test/parity/test_long_training_parity.py
          - part: long training
            files: lucid/test/parity/test_long_training_parity.py

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      # A self-hosted runner keeps its own ccache on disk and has the
      # checkpoints in its home already; uploading either to the Actions
      # cache would only spend its bandwidth.
      - name: Set up ccache
        if: runner.environment == 'github-hosted'
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nightly-parity-py3.14
          max-size: 600M

      - name: Cache published checkpoints
        if: runner.environment == 'github-hosted'
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucid
          key: lucid-weights-${{ hashFiles('lucid/models/**/_weights.py') }}
          restore-keys: lucid-weights-

      - name: Install Lucid and every oracle
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1" mlx
          python -m pip install --no-build-isolation -e ".[test]"
          python -m pip install torch torchvision timm transformers diffusers \
              torchdiffeq opencv-python-headless albumentations scipy

      - name: Confirm the oracles are present
        run: |
          python - <<'PY'
          import importlib.util as u
          need = ["torch", "torchvision", "timm", "transformers", "diffusers",
                  "torchdiffeq", "cv2", "albumentations", "scipy"]
          missing = [m for m in need if u.find_spec(m) is None]
          if missing:
              raise SystemExit(f"this job verifies nothing without {missing}")
          print("every oracle present")
          PY

      - name: Parity tier, ${{ matrix.part }}
        run: python scripts/ci_nightly_suite.py ${{ matrix.files }}

  nightly-models:
    name: Nightly model zoo (every file)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: nightly-models-py3.14
          max-size: 600M

      - name: Cache published checkpoints
        uses: actions/cache@v4
        with:
          path: ~/.cache/lucid
          key: lucid-weights-${{ hashFiles('lucid/models/**/_weights.py') }}
          restore-keys: lucid-weights-

      - name: Install Lucid and the oracles the zoo tests read
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1" mlx
          python -m pip install --no-build-isolation -e ".[test]"
          python -m pip install torch torchvision timm transformers diffusers scipy

      - name: Model zoo, every file
        run: python scripts/ci_nightly_suite.py lucid/test/unit/models

  # Wall-clock timings, recorded and never enforced: a shared runner's speed
  # varies more than a regression worth catching.  The enforced budget is
  # lucid/test/unit/cost — allocations, peak bytes and dispatched ops per
  # training step, exact on any machine, run on every push.  This job keeps
  # the timings that budget cannot see, one artifact per night.
  nightly-perf:
    name: Nightly perf (recorded)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 20          # measured 4 min

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # Install build deps + mlx in the host env, then `--no-build-isolation`
          # so the editable build links against the *runtime* libmlx.dylib
          # (PEP 517 build-env paths get baked into the .so RPATH otherwise).
          # `clang-format==22.*` pinned to match local dev (Homebrew LLVM 22)
          # — the system clang-format on the macos-26 image differs in style output.
          python -m pip install setuptools wheel cmake ninja "pybind11>=3.0,<3.1" mlx \
              "clang-format>=22,<23"
          python -m pip install --no-build-isolation -e ".[test]"

      - name: Record timings
        run: |
          mkdir -p perf
          python -m lucid.benchmarks.run_all --quiet --json perf/run_all.json
          python -m pytest lucid/test/perf/ -q --benchmark-json=perf/pytest_benchmark.json

      - uses: actions/upload-artifact@v4
        with:
          name: perf-history-${{ github.run_number }}
          path: perf/
          if-no-files-found: error
          retention-days: 90
