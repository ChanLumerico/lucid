name: Publish Test PyPI Wheels

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-wheels:
    name: Build wheel / Python ${{ matrix.python-version }}
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        # Lucid is Python 3.14 only (PEP 649 lazy annotations; see ci.yml).
        python-version: ["3.14"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Enforce Apple Silicon runner
        run: |
          python - <<'PY'
          import platform

          system = platform.system()
          machine = platform.machine()
          if system != "Darwin" or machine != "arm64":
              raise SystemExit(f"Lucid release supports macOS arm64 only, got {system}/{machine}")
          print(f"runner={system}/{machine}")
          PY

      - uses: ./.github/actions/pinned-mlx

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # No `mlx`: the engine links the MLX build pinned in
          # [tool.lucid.mlx] and the wheel ships it beside the engine.
          #
          # pybind11 pinned to match [build-system].requires — without
          # isolation pip resolves the host env against that list, so an
          # unpinned install fails the moment upstream ships a version
          # outside the pin.
          python -m pip install setuptools wheel cmake ninja \
              "pybind11>=3.0,<3.1"

      - name: Build wheel
        env:
          # The deployment target is the pinned-mlx step's.  The tag
          # stays 26.0: scripts/ci_publish.sh says why.
          _PYTHON_HOST_PLATFORM: "macosx-26.0-arm64"
          ARCHFLAGS: "-arch arm64"
        run: |
          python -m pip wheel . -w dist/ --no-deps --no-build-isolation -q
          ls -lh dist/

      # Contents, tag and size, then a fresh venv with no `mlx` (see
      # publish.yml): ci_publish.sh reuses the wheel in dist/.
      - name: Verify the wheel in a clean venv
        run: ./scripts/ci_publish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-testpypi-wheel-py${{ matrix.python-version }}
          path: dist/*.whl

  # ── The wheel on a fresh runner (see publish.yml) ───────────────────
  verify-macos-26:
    name: Verify wheel on a fresh macOS 26 runner
    needs: build-wheels
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          pattern: lucid-testpypi-wheel-*
          merge-multiple: true
          path: dist

      - name: Install the wheel and smoke it
        run: |
          sw_vers -productVersion
          ./scripts/ci_publish.sh

  publish-testpypi:
    name: Publish to Test PyPI
    needs: [build-wheels, verify-macos-26]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    environment:
      name: testpypi
      url: https://test.pypi.org/p/lucid-dl

    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: lucid-testpypi-wheel-*
          path: dist
          merge-multiple: true

      - name: List release artifacts
        run: ls -lh dist

      - name: Publish wheels to Test PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist
          skip-existing: true
