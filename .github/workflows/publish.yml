name: Publish to PyPI

# Production PyPI release pipeline.
#
# Triggered two ways:
#
#   1. `git tag v3.0.0 && git push origin v3.0.0` — full automated release.
#   2. Manual `workflow_dispatch` with an explicit `version` input — for
#      re-runs after a partial failure (artifact already built, etc.).
#
# Test PyPI publishing is handled by `release-testpypi.yml` and runs on
# the same `v*` tag push — Test PyPI is intended to be a *gating* step
# before this workflow is allowed to publish to real PyPI.
#
# Authentication uses PyPI Trusted Publishing (OIDC), not an API token,
# so no `secrets.PYPI_API_TOKEN` is required as long as the
# `lucid-dl` PyPI project is configured to trust this workflow.

on:
  push:
    tags:
      # Production releases only — pure semver `vMAJOR.MINOR.PATCH`. This
      # deliberately excludes pre-release tags like `v3.0.0-rc1` (those
      # only trigger `release-testpypi.yml` for Test PyPI staging).
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish (without leading 'v', e.g. 3.0.0). If empty, derived from the git tag."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ── Build wheel + sdist on Apple Silicon ────────────────────────────
  build:
    name: Build wheel + sdist
    runs-on: macos-26
    outputs:
      version: ${{ steps.derive-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Need tags for version derivation

      - name: Enforce Apple Silicon runner
        run: |
          python3 - <<'PY'
          import platform

          system = platform.system()
          machine = platform.machine()
          if system != "Darwin" or machine != "arm64":
              raise SystemExit(f"Lucid release supports macOS arm64 only, got {system}/{machine}")
          print(f"runner={system}/{machine}")
          PY

      - name: Derive version (from input, tag, or lucid/version.py)
        id: derive-version
        run: |
          # Priority: workflow_dispatch input > git tag > lucid/version.py
          INPUT_VERSION="${{ github.event.inputs.version }}"
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="$INPUT_VERSION"
            SOURCE="workflow_dispatch input"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            SOURCE="git tag"
          else
            VERSION=$(python3 -c "import re, pathlib; m = re.search(r'__version__: str = \"([^\"]+)\"', pathlib.Path('lucid/version.py').read_text()); print(m.group(1))")
            SOURCE="lucid/version.py"
          fi
          echo "Resolved version=$VERSION (source: $SOURCE)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Verify version consistency
        env:
          RESOLVED_VERSION: ${{ steps.derive-version.outputs.version }}
        run: |
          # pyproject.toml [project].version, lucid/version.py __version__,
          # and the resolved release version must all agree.
          python3 - <<'PY'
          import os, re, sys, pathlib, tomllib
          resolved = os.environ["RESOLVED_VERSION"]
          pyproj = tomllib.loads(pathlib.Path("pyproject.toml").read_text())
          py_version = pyproj["project"]["version"]
          m = re.search(r'__version__: str = "([^"]+)"', pathlib.Path("lucid/version.py").read_text())
          src_version = m.group(1)
          print(f"resolved={resolved}  pyproject={py_version}  source={src_version}")
          if not (resolved == py_version == src_version):
              print("ERROR: version mismatch — bump all three before tagging.", file=sys.stderr)
              sys.exit(1)
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: ./.github/actions/pinned-mlx

      - name: Install build dependencies
        run: |
          python -m pip install --upgrade pip
          # No `mlx`: the engine links the MLX build pinned in
          # [tool.lucid.mlx] (tools/fetch_mlx.py stages it) and the wheel
          # ships it beside the engine.
          #
          # pybind11 carries the same pin as [build-system].requires in
          # pyproject.toml, and must: `build --no-isolation` checks the
          # host env against that list, so an unpinned install resolves
          # to whatever is newest and the build aborts with "Missing
          # dependencies: pybind11<3.1,>=3.0" the day a 3.1 appears.
          python -m pip install setuptools wheel cmake ninja \
              "pybind11>=3.0,<3.1" build

      - name: Build wheel + sdist
        env:
          # MACOSX_DEPLOYMENT_TARGET comes from the pinned-mlx step: the
          # pinned MLX build's minos, the floor lucid._C enforces at import.
          #
          # The platform tag is separate.  python.org's Python 3.14 is a
          # universal2 build, so without this override the wheel ships a
          # `universal2` tag, advertising x86_64 compatibility for an
          # arm64-only engine.  It says 26.0, not the 26.2 floor, because
          # pip spells every macOS 11+ release X_0: no tag can say 26.2.
          _PYTHON_HOST_PLATFORM: "macosx-26.0-arm64"
          ARCHFLAGS: "-arch arm64"
        run: |
          # The sdist first, then the wheel built from it: what a source
          # install does, including staging the pinned MLX from the sdist's
          # tools/fetch_mlx.py.  --no-isolation reuses the toolchain above.
          python -m build --no-isolation
          ls -lh dist/

      # Contents (the bundled MLX, no stray libmlx), tag, size against
      # PyPI's limit, then a fresh venv with no `mlx`: import, a Metal
      # matmul on the pinned MLX, the engine's MLX loaded from inside the
      # wheel, and the installed engine's link (tools/check_engine_link.py).
      - name: Verify the wheel in a clean venv
        run: ./scripts/ci_publish.sh

      - uses: actions/upload-artifact@v4
        with:
          name: lucid-pypi-dist
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  # ── The wheel on a fresh runner ─────────────────────────────────────
  # The build job smokes the wheel on the machine that built it, where the
  # staged MLX cache exists.  A runner that never built anything is the
  # user's view: only what the wheel carries.  Its macOS floor is 26.2 (the
  # pinned MLX build's minos), enforced at import since the tag cannot say it.
  verify-macos-26:
    name: Verify wheel on a fresh macOS 26 runner
    needs: build
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - uses: actions/download-artifact@v4
        with:
          name: lucid-pypi-dist
          path: dist

      - name: Install the wheel and smoke it
        run: |
          sw_vers -productVersion
          ./scripts/ci_publish.sh

  # ── Publish to PyPI (Trusted Publishing / OIDC) ─────────────────────
  publish:
    name: Publish to PyPI
    needs: [build, verify-macos-26]
    runs-on: ubuntu-latest
    environment:
      name: release
      url: https://pypi.org/project/lucid-dl/${{ needs.build.outputs.version }}/
    permissions:
      contents: read
      id-token: write   # Required for OIDC trusted publishing

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: lucid-pypi-dist
          path: dist

      - name: List release artifacts
        run: ls -lh dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist
          # `skip-existing` is OFF for production: re-uploading the same
          # version is almost always a mistake. Bump the version instead.
          skip-existing: false
